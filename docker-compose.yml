services:
  # Servicio 1: API REST (FastAPI) en el puerto 8000
  api:
    build: .
    image: riesgo-crediticio:latest
    container_name: riesgo-api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped

  # Servicio 2: Agente (Gradio) en el puerto 7860
  #   - habla con la API por la red interna: http://api:8000/predict
  #   - habla con Ollama que corre en el HOST: host.docker.internal:11434
  agent:
    build: .
    image: riesgo-crediticio:latest
    container_name: riesgo-agente
    command: ["python", "agent/app_gradio.py"]
    ports:
      - "${AGENT_PORT:-7860}:7860"
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: "7860"
      API_URL: http://api:8000
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
      API_TIMEOUT: ${API_TIMEOUT:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./models:/app/models
    depends_on:
      - api
    restart: unless-stopped
